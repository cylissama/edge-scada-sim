# Simulated overhead ArUco cameras. Markers ride a rounded-rectangle loop;
# each camera has its own loop size, speed and depth. Cameras 2 and 4 see the
# whole loop; on 1 and 3 the loop is wider than the view, so markers drop out at the ends.
# ponytail: blocks repeated per device; template them if device count grows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-1
  namespace: scada
  labels: &labels {app: camera-1, role: device, kind: camera, scada/controllable: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: camera-1}
  template:
    metadata:
      labels: *labels
    spec:
      enableServiceLinks: false
      nodeSelector: {tier: edge}
      containers:
        - name: camera
          image: edge-scada-sim-camera
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: DEVICE_ID, value: "camera-1"}
            - {name: KAFKA_TOPIC, value: "camera-poses"}
            - {name: FPS, value: "15"}
            - {name: MARKERS, value: "1,2,3"}
            - {name: PATH_W, value: "2.4"}
            - {name: PATH_H, value: "1.2"}
            - {name: CORNER_R, value: "0.3"}
            - {name: SPEED, value: "0.25"}
            - {name: DEPTH, value: "1.5"}
          resources:
            requests: {cpu: 20m, memory: 40Mi}
            limits: {memory: 96Mi}
---
