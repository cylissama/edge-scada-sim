# MongoDB: single replica, data on a PVC. Credentials come from the
# kustomize-generated "mongo-auth" Secret (dev-only values, see kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: scada
spec:
  selector: {app: mongo}
  ports:
    - {name: mongo, port: 27017, targetPort: mongo}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: scada
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo, role: core-service, kind: database}
    spec:
      enableServiceLinks: false
      nodeSelector: {tier: core}
      containers:
        - name: mongo
          image: mongo:7.0
          # Cap the WiredTiger cache, otherwise Mongo sizes it from the node's RAM, not our limit.
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - {name: mongo, containerPort: 27017}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-auth, key: username}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-auth, key: password}}
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# mongo-express: web UI to browse collections and run queries (pgAdmin-style).
#   kubectl -n scada port-forward svc/mongo-express 8081  ->  http://localhost:8081
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: scada
spec:
  selector: {app: mongo-express}
  ports:
    - {name: http, port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: scada
spec:
  replicas: 1
  selector:
    matchLabels: {app: mongo-express}
  template:
    metadata:
      labels: {app: mongo-express, role: core-service, kind: db-ui}
    spec:
      enableServiceLinks: false
      nodeSelector: {tier: core}
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2
          ports:
            - {name: http, containerPort: 8081}
          env:
            - name: MONGO_USER
              valueFrom: {secretKeyRef: {name: mongo-auth, key: username}}
            - name: MONGO_PASS
              valueFrom: {secretKeyRef: {name: mongo-auth, key: password}}
            - {name: ME_CONFIG_MONGODB_URL, value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo:27017/?authSource=admin"}
            - {name: ME_CONFIG_BASICAUTH, value: "true"}
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom: {secretKeyRef: {name: mongo-auth, key: ui-username}}
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom: {secretKeyRef: {name: mongo-auth, key: ui-password}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 160Mi}
