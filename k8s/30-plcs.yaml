# Simulated PLCs: OPC UA servers on the edge node. One Deployment + Service each,
# so each can be stopped individually. Tags come from k8s/config/plc-tags.json.
apiVersion: v1
kind: Service
metadata:
  name: plc-1
  namespace: scada
spec:
  selector: {app: plc-1}
  ports:
    - {name: opcua, port: 4840, targetPort: opcua}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-1
  namespace: scada
  labels: &labels {app: plc-1, role: device, kind: plc, scada/controllable: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: plc-1}
  template:
    metadata:
      labels: *labels
    spec:
      enableServiceLinks: false
      nodeSelector: {tier: edge}
      containers:
        - name: plc
          image: edge-scada-sim-plc
          imagePullPolicy: IfNotPresent
          ports:
            - {name: opcua, containerPort: 4840}
          env:
            - {name: PLC_ID, value: "plc-1"}
            - {name: TAGS_CONFIG, value: "/config/plc-tags.json"}
          readinessProbe:
            tcpSocket: {port: opcua}
            periodSeconds: 5
          volumeMounts:
            - {name: tags, mountPath: /config, readOnly: true}
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {memory: 160Mi}
      volumes:
        # Generated by kustomize from k8s/config/plc-tags.json. The name gets a
        # content hash, so editing the JSON + "kubectl apply -k k8s" restarts the PLCs.
        - name: tags
          configMap: {name: plc-tags}
---
