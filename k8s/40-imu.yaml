# One Deployment per device so the dashboard can stop/start each one
# individually (scale 0 <-> 1). Phase 2 adds imu-2..imu-4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imu-1
  namespace: scada
  labels: &labels {app: imu-1, role: device, kind: imu, scada/controllable: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: imu-1}
  template:
    metadata:
      labels: *labels
    spec:
      enableServiceLinks: false
      nodeSelector: {tier: edge}
      containers:
        - name: imu
          image: edge-scada-sim-imu
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: KAFKA_TOPIC, value: "imu-readings"}
            - {name: DEVICE_ID, value: "imu-1"}
            - {name: RATE_HZ, value: "10"}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
