# Headless Service: gives each StatefulSet pod a stable DNS name
# (kafka-0.kafka-headless.scada.svc). publishNotReadyAddresses is required
# because the KRaft controller must resolve its own name BEFORE the pod is Ready.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: scada
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - {name: broker, port: 9092}
    - {name: controller, port: 9093}
---
# Regular Service: the stable address clients use (kafka:9092).
# Only routes to pods that pass the readiness probe.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: scada
spec:
  selector:
    app: kafka
  ports:
    - {name: broker, port: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: scada
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # A Service named "kafka" makes K8s inject env vars like KAFKA_PORT into
      # pods. The Kafka image treats KAFKA_* env vars as broker config, so
      # those injected variables would corrupt the config. Turn injection off.
      enableServiceLinks: false
      nodeSelector: {tier: core}
      securityContext:
        fsGroup: 1000          # the image runs as uid 1000; let it write the volume
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - {name: broker, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: CLUSTER_ID, value: "4L6g3nShT-eMCtK--X86sw"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless:9093"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            # Topics must be created explicitly (with 3 partitions). Otherwise a
            # producer that starts early would auto-create a 1-partition topic.
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m"}
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  # Each pod gets its own PersistentVolumeClaim. Deleting the pod keeps the data.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
