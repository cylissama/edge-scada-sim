# kubectl apply -k k8s
# Image tags are set here so the same manifests run local ":dev" builds or
# CI-built GHCR images (CI runs: kustomize edit set image ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 10-kafka.yaml
  - 20-topic-init-job.yaml
  - 40-imu.yaml
images:
  - name: edge-scada-sim-imu
    newName: ghcr.io/cylissama/edge-scada-sim-imu
    newTag: dev
