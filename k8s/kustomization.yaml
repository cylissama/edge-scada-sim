# kubectl apply -k k8s
# Image tags are set here so the same manifests run local ":dev" builds or
# CI-built GHCR images (CI runs: kustomize edit set image ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scada
resources:
  - 00-namespace.yaml
  - 10-kafka.yaml
  - 20-topic-init-job.yaml
  - 30-plcs.yaml
  - 35-gateway.yaml
  - 40-imus.yaml
  - 45-cameras.yaml
  - 50-mongo.yaml
  - 55-historian.yaml
  - 60-api.yaml
configMapGenerator:
  - name: plc-tags
    files: [plc-tags.json=config/plc-tags.json]
# ponytail: dev-only credentials committed in the repo. Real deployments must
# replace these (e.g. an external secret store) before exposing anything.
secretGenerator:
  - name: mongo-auth
    literals:
      - username=scada
      - password=scada-dev-password
      - ui-username=admin
      - ui-password=admin
images:
  - name: edge-scada-sim-imu
    newName: ghcr.io/cylissama/edge-scada-sim-imu
    newTag: dev
  - name: edge-scada-sim-plc
    newName: ghcr.io/cylissama/edge-scada-sim-plc
    newTag: dev
  - name: edge-scada-sim-gateway
    newName: ghcr.io/cylissama/edge-scada-sim-gateway
    newTag: dev
  - name: edge-scada-sim-camera
    newName: ghcr.io/cylissama/edge-scada-sim-camera
    newTag: dev
  - name: edge-scada-sim-historian
    newName: ghcr.io/cylissama/edge-scada-sim-historian
    newTag: dev
  - name: edge-scada-sim-api
    newName: ghcr.io/cylissama/edge-scada-sim-api
    newTag: dev
